<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - ShipTrack</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">🚚 ShipTrack</a>
    <div class="nav-user">
      <span id="userName"></span>
      <button id="logoutBtn" class="btn small danger">Logout</button>
    </div>
  </nav>

  <main class="dashboard">
    <div class="dashboard-head">
      <div>
        <span class="pill">DASHBOARD</span>
        <h1 id="dashboardTitle">Shipments</h1>
        <p class="muted" id="dashboardSubtitle"></p>
      </div>
      <a id="createBtn" class="btn" href="#create">+ Create Shipment</a>
    </div>

    <div id="stats" class="stats"></div>

    <section id="createSection" class="card form-card hidden">
      <h2>Create a Shipment</h2>
      <p class="muted">Fill in the parcel details.</p>

      <form id="shipmentForm" class="form-grid">
        <div>
          <label>Sender name</label>
          <input id="senderName" required>
        </div>
        <div>
          <label>Sender phone</label>
          <input id="senderPhone" required>
        </div>
        <div class="full-span">
          <label>Pickup address</label>
          <textarea id="pickupAddress" required></textarea>
        </div>
        <div>
          <label>Receiver name</label>
          <input id="receiverName" required>
        </div>
        <div>
          <label>Receiver phone</label>
          <input id="receiverPhone" required>
        </div>
        <div class="full-span">
          <label>Delivery address</label>
          <textarea id="deliveryAddress" required></textarea>
        </div>
        <div>
          <label>Package type</label>
          <select id="packageType">
            <option>Documents</option>
            <option>Electronics</option>
            <option>Clothing</option>
            <option>Food</option>
            <option>Other</option>
          </select>
        </div>
        <div>
          <label>Weight (kg)</label>
          <input id="weight" type="number" min="0.1" step="0.1" required>
        </div>
        <div class="full-span">
          <button class="btn" type="submit">Create Shipment</button>
        </div>
      </form>
      <div id="formMessage" class="message"></div>
    </section>

    <section class="card">
      <div class="section-row">
        <div>
          <h2>Shipment List</h2>
          <p class="muted">Click Track to see the full timeline.</p>
        </div>
        <button id="refreshBtn" class="btn secondary small">Refresh</button>
      </div>
      <div id="shipmentList"></div>
    </section>
  </main>

  <script src="/js/dashboard.js"></script>
</body>
</html>
